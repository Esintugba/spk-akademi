services:
  api:
    image: ghcr.io/esintugba/spk-akademi-api:latest
    pull_policy: always
    container_name: spk-api
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      Database__Provider: Sqlite
      Database__AutoMigrate: ${Database__AutoMigrate:-true}
      Database__AllowProductionAutoMigrate: ${Database__AllowProductionAutoMigrate:-true}
      ConnectionStrings__DefaultConnection: ${ConnectionStrings__DefaultConnection:-Data Source=/data/spk.db}
      ForwardedHeaders__Enabled: ${ForwardedHeaders__Enabled:-false}
      ForwardedHeaders__KnownProxies__0: ${ForwardedHeaders__KnownProxies__0:-}
      ForwardedHeaders__ForwardLimit: ${ForwardedHeaders__ForwardLimit:-1}
      ForwardedHeaders__RequireHeaderSymmetry: ${ForwardedHeaders__RequireHeaderSymmetry:-true}
      Jwt__Key: ${JWT_KEY:?JWT_KEY is required}
      Jwt__PreviousKeys__0: ${JWT_PREVIOUS_KEY_0:-}
      AllowedHosts: ${AllowedHosts:?AllowedHosts is required}
      Cors__AllowedOrigins__0: ${Cors__AllowedOrigins__0:?Cors__AllowedOrigins__0 is required}
      Seo__PublicBaseUrl: ${Seo__PublicBaseUrl:?Seo__PublicBaseUrl is required}
      Email__Enabled: ${Email__Enabled:-false}
      Email__FromAddress: ${Email__FromAddress}
      Email__FromName: ${Email__FromName}
      Email__AdminNotificationAddress: ${Email__AdminNotificationAddress:-akademispk@gmail.com}
      Email__SmtpHost: ${Email__SmtpHost}
      Email__SmtpPort: ${Email__SmtpPort}
      Email__SmtpUser: ${Email__SmtpUser}
      Email__SmtpPassword: ${Email__SmtpPassword}
      Email__UseSsl: ${Email__UseSsl}
      AiQuestionGeneration__Enabled: ${AiQuestionGeneration__Enabled:-false}
      AiQuestionGeneration__ApiKey: ${AiQuestionGeneration__ApiKey:-}
      AiQuestionGeneration__BaseUrl: ${AiQuestionGeneration__BaseUrl:-https://api.openai.com/v1/}
      AiQuestionGeneration__Model: ${AiQuestionGeneration__Model:-gpt-5.6}
      DataProtection__KeysPath: /keys
      Serilog__WriteTo__1__Args__path: /logs/spk-.log
    ports:
      - "${APP_PORT:-8080}:8080"
    volumes:
      - ./storage/data:/data
      - ./storage/uploads:/app/wwwroot/uploads
      - ./storage/imports:/app/imports
      - ./storage/logs:/logs
      - ./storage/data-protection:/keys
      
